<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TENPO STUDIO 2.0 — デザインエディター</title><style>
:root{--ink:#1e2423;--muted:#78817e;--line:#e6e9e6;--accent:#245e4d;--bg:#f4f5f3}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}.brand{font-size:19px;font-weight:850;letter-spacing:-.8px;white-space:nowrap}.brand em{font-style:normal;color:var(--accent)}.topright,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #dce1dd;background:#fff;color:#26312c;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:650}.btn:hover{background:#f4f7f4}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 268px;height:calc(100vh - 64px)}.sidebar,.props{background:white;overflow-y:auto;padding:22px 16px}.sidebar{border-right:1px solid var(--line)}.props{border-left:1px solid var(--line)}h2{font-size:12px;letter-spacing:1.1px;color:#84908a;margin:0 0 15px;font-weight:800}h3{font-size:14px;margin:18px 0 10px}.tool{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 12px;margin-bottom:9px;background:white;text-align:left;font-size:14px;font-weight:650}.tool:hover{border-color:#9db5aa;background:#f5f9f6}.tool .ico{font-size:20px;width:25px;text-align:center}.help{color:#78817e;font-size:12px;line-height:1.8;margin-top:18px}.workspace{min-width:0;overflow:auto;display:flex;flex-direction:column}.workhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.workhead strong{font-size:13px}.canvasarea{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:32px;min-height:0;background-color:#f2f3f1;background-image:radial-gradient(#d8ddd9 .7px,transparent .7px);background-size:16px 16px}.board{position:relative;background:white;box-shadow:0 14px 55px #283a2d20;flex:none;touch-action:none}.board canvas{display:block;width:100%;height:100%;touch-action:none}.status{border-top:1px solid var(--line);padding:10px 18px;color:#69766e;font-size:12px;background:#fff}.field{margin-bottom:16px}.field label{display:block;color:#65716b;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dce2dd;border-radius:9px;background:white;color:var(--ink);font-size:14px}.field input[type=color]{height:43px;padding:4px}.field input[type=range]{padding:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{font-size:13px;line-height:1.9;color:var(--muted)}.smallbtns{display:flex;flex-wrap:wrap;gap:7px}.smallbtns .btn{font-size:12px;padding:8px 10px}.separator{height:1px;background:var(--line);margin:18px 0}.badge{font-size:11px;color:var(--accent);background:#e8f2eb;border-radius:50px;padding:5px 9px}.mobiletools{display:none}.file{display:none}@media(max-width:900px){.shell{grid-template-columns:180px minmax(0,1fr)}.props{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);min-height:280px}.shell{height:auto;min-height:calc(100vh - 64px)}.sidebar{padding:15px 10px}.canvasarea{min-height:600px}.top{padding:10px;height:auto;min-height:64px}}@media(max-width:620px){.shell{display:block}.sidebar{display:flex;overflow-x:auto;gap:7px;border-right:0;border-bottom:1px solid var(--line);padding:10px}.sidebar h2,.sidebar .help{display:none}.tool{flex:none;width:auto;margin:0;padding:9px;font-size:12px;gap:5px}.tool .ico{font-size:16px;width:auto}.canvasarea{min-height:440px;padding:20px 12px}.props{padding:18px}.top{align-items:flex-start;flex-wrap:wrap}.topright{width:100%}.workhead{padding:12px}.board{max-width:none}.brand{font-size:18px}}
</style></head><body><header class="top"><div class="brand">TENPO <em>STUDIO</em> <span class="badge">2.0 BETA</span></div><div class="topright"><button class="btn" id="undo">↶ 戻す</button><button class="btn" id="redo">↷ やり直す</button><button class="btn" id="save">下書き保存</button><button class="btn" id="load">下書き読込</button><button class="btn primary" id="export">PNG書き出し ↗</button></div></header><main class="shell"><aside class="sidebar"><h2>追加する</h2><button class="tool" id="addtext"><span class="ico">T</span>テキスト</button><button class="tool" id="addprice"><span class="ico">¥</span>価格</button><button class="tool" id="addrect"><span class="ico">▣</span>四角形</button><button class="tool" id="addcircle"><span class="ico">◯</span>円形</button><button class="tool" id="addimage"><span class="ico">▧</span>写真</button><input class="file" type="file" id="imagefile" accept="image/*"><div class="help">白紙から自由にデザインできます。<br>要素をクリックして選択し、ドラッグで移動。右下の丸をドラッグするとサイズ変更できます。<br><br>キーボード：Deleteで削除、Ctrl/⌘+Zで戻す。</div></aside><section class="workspace"><div class="workhead"><strong>無題のデザイン</strong><div class="toolbar"><select id="paper" class="btn" aria-label="用紙サイズ"><option value="a4">A4 縦</option><option value="square">SNS 正方形</option><option value="landscape">A4 横</option></select><button class="btn" id="clear">白紙に戻す</button></div></div><div class="canvasarea" id="canvasarea"><div class="board" id="board"><canvas id="canvas"></canvas></div></div><div class="status" id="status">準備完了 · オブジェクトを追加してください</div></section><aside class="props"><h2>プロパティ</h2><div id="properties"><p class="empty">オブジェクトを選択すると、ここで文字・色・サイズなどを編集できます。</p></div><div class="separator"></div><h2>背景</h2><div class="field"><label for="background">背景色</label><input id="background" type="color" value="#ffffff"></div><p class="help">画像・デザインデータは、このブラウザ内で処理されます。下書き保存は端末のブラウザに保存されます。</p></aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),board=$('board'),area=$('canvasarea');let size={w:595,h:842},items=[],selected=null,bg='#ffffff',history=[],future=[],drag=null,images=new Map(),uid=1;const fonts=['sans-serif','serif','Arial','Georgia','monospace'];const clone=v=>JSON.parse(JSON.stringify(v));function snap(){history.push(JSON.stringify({items,bg,size}));if(history.length>80)history.shift();future=[];updateHistory()}function updateHistory(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}function setDoc(d){items=clone(d.items);bg=d.bg;size=clone(d.size);selected=null;$('background').value=bg;$('paper').value=size.w===size.h?'square':size.w>size.h?'landscape':'a4';setSize();draw();props();updateHistory()}function undo(){if(!history.length)return;future.push(JSON.stringify({items,bg,size}));setDoc(JSON.parse(history.pop()))}function redo(){if(!future.length)return;history.push(JSON.stringify({items,bg,size}));setDoc(JSON.parse(future.pop()))}function setSize(){const maxW=Math.max(240,area.clientWidth-56),maxH=window.innerWidth<620?450:Math.max(360,window.innerHeight-215);const scale=Math.min(1,maxW/size.w,maxH/size.h);board.style.width=(size.w*scale)+'px';board.style.height=(size.h*scale)+'px';canvas.width=size.w*2;canvas.height=size.h*2;canvas.style.width='100%';canvas.style.height='100%';draw()}function box(it){return{x:it.x,y:it.y,w:it.w,h:it.h}}function textlines(it){return String(it.text||'').split('\n')}function render(withSelection=true){ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle=bg;ctx.fillRect(0,0,size.w,size.h);for(const it of items){ctx.save();ctx.translate(it.x+it.w/2,it.y+it.h/2);ctx.rotate((it.rotation||0)*Math.PI/180);ctx.translate(-it.w/2,-it.h/2);if(it.type==='rect'){ctx.fillStyle=it.color;ctx.fillRect(0,0,it.w,it.h)}else if(it.type==='circle'){ctx.fillStyle=it.color;ctx.beginPath();ctx.ellipse(it.w/2,it.h/2,Math.abs(it.w/2),Math.abs(it.h/2),0,0,2*Math.PI);ctx.fill()}else if(it.type==='image'){const im=images.get(it.id);if(im){ctx.drawImage(im,0,0,it.w,it.h)}else if(it.src){loadImage(it)}}else{ctx.fillStyle=it.color;ctx.textBaseline='top';ctx.font=`${it.bold?'700':'400'} ${it.fontSize}px ${it.font||'sans-serif'}`;let y=0;for(const line of textlines(it)){ctx.fillText(line,0,y);y+=it.fontSize*1.25}}ctx.restore();if(withSelection&&it.id===selected){ctx.save();ctx.translate(it.x+it.w/2,it.y+it.h/2);ctx.rotate((it.rotation||0)*Math.PI/180);ctx.translate(-it.w/2,-it.h/2);ctx.strokeStyle='#2c8ee7';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.strokeRect(0,0,it.w,it.h);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.strokeStyle='#2c8ee7';ctx.beginPath();ctx.arc(it.w,it.h,7,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}}}function draw(){render(true);$('status').textContent=selected?`選択中：${items.find(x=>x.id===selected)?.type||'なし'} · ${items.length} オブジェクト`:`${items.length} オブジェクト · クリックして編集`}function loadImage(it){if(images.has(it.id)||!it.src)return;const im=new Image();im.onload=()=>{images.set(it.id,im);draw()};im.src=it.src}function add(type){snap();const base={id:uid++,type,x:90,y:120,w:240,h:80,rotation:0,color:'#203c32'};if(type==='text')Object.assign(base,{text:'テキストを入力',fontSize:34,bold:true,font:'sans-serif',w:350,h:54});if(type==='price')Object.assign(base,{text:'¥ 680',fontSize:74,bold:true,font:'sans-serif',w:340,h:100});if(type==='rect')Object.assign(base,{w:230,h:130,color:'#d9e8d9'});if(type==='circle')Object.assign(base,{w:150,h:150,color:'#e7c7a5'});items.push(base);selected=base.id;draw();props()}function get(){return items.find(x=>x.id===selected)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function props(){const p=$('properties'),it=get();if(!it){p.innerHTML='<p class="empty">オブジェクトをクリックすると、ここで文字・色・サイズなどを編集できます。</p>';return}let html=`<div class="field"><label>種類</label><strong>${{text:'テキスト',price:'価格',rect:'四角形',circle:'円形',image:'写真'}[it.type]}</strong></div>`;if(it.type==='text'||it.type==='price')html+=`<div class="field"><label>テキスト</label><textarea id="ptext" rows="3">${esc(it.text)}</textarea></div><div class="grid2"><div class="field"><label>文字サイズ</label><input type="number" id="pfontSize" min="8" max="240" value="${it.fontSize}"></div><div class="field"><label>フォント</label><select id="pfont">${fonts.map(f=>`<option value="${f}" ${it.font===f?'selected':''}>${f}</option>`).join('')}</select></div></div><div class="field"><label><input type="checkbox" id="pbold" ${it.bold?'checked':''} style="width:auto"> 太字</label></div>`;if(it.type!=='image')html+=`<div class="field"><label>色</label><input type="color" id="pcolor" value="${it.color}"></div>`;html+=`<div class="grid2"><div class="field"><label>X位置</label><input type="number" id="px" value="${Math.round(it.x)}"></div><div class="field"><label>Y位置</label><input type="number" id="py" value="${Math.round(it.y)}"></div><div class="field"><label>幅</label><input type="number" id="pw" min="10" value="${Math.round(it.w)}"></div><div class="field"><label>高さ</label><input type="number" id="ph" min="10" value="${Math.round(it.h)}"></div></div><div class="field"><label>回転（度）</label><input type="range" id="protation" min="-180" max="180" value="${it.rotation||0}"></div><div class="smallbtns"><button class="btn" id="front">前面へ</button><button class="btn" id="back">背面へ</button><button class="btn" id="duplicate">複製</button><button class="btn" id="delete">削除</button></div>`;p.innerHTML=html;for(const [id,key] of Object.entries({ptext:'text',pfontSize:'fontSize',pfont:'font',pcolor:'color',px:'x',py:'y',pw:'w',ph:'h',protation:'rotation',pbold:'bold'})){const el=$(id);if(!el)continue;el.addEventListener('focus',()=>{if(!el.dataset.snap){snap();el.dataset.snap='1'}});el.addEventListener('change',()=>{if(!el.dataset.snap)snap();delete el.dataset.snap});el.addEventListener('input',()=>{let val=id==='pbold'?el.checked:el.value;if(['fontSize','x','y','w','h','rotation'].includes(key))val=Number(val);if(['w','h','fontSize'].includes(key))val=Math.max(8,val);it[key]=val;draw()})}const action=(id,fn)=>$(id).addEventListener('click',()=>{snap();fn();draw();props()});action('front',()=>{items=items.filter(x=>x!==it);items.push(it)});action('back',()=>{items=items.filter(x=>x!==it);items.unshift(it)});action('duplicate',()=>{const copy=clone(it);copy.id=uid++;copy.x+=24;copy.y+=24;items.push(copy);if(it.type==='image'&&images.has(it.id))images.set(copy.id,images.get(it.id));selected=copy.id});action('delete',()=>{items=items.filter(x=>x!==it);selected=null})}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*size.w/r.width,y:(e.clientY-r.top)*size.h/r.height}}function hit(p){for(let i=items.length-1;i>=0;i--){const it=items[i],cx=it.x+it.w/2,cy=it.y+it.h/2,a=-(it.rotation||0)*Math.PI/180,dx=p.x-cx,dy=p.y-cy,x=dx*Math.cos(a)-dy*Math.sin(a)+it.w/2,y=dx*Math.sin(a)+dy*Math.cos(a)+it.h/2;if(x>=-4&&x<=it.w+4&&y>=-4&&y<=it.h+4)return it}return null}canvas.addEventListener('pointerdown',e=>{const p=point(e),it=get();if(it&&Math.hypot(p.x-(it.x+it.w),p.y-(it.y+it.h))<19){snap();drag={mode:'resize',start:p,x:it.x,y:it.y,w:it.w,h:it.h};canvas.setPointerCapture(e.pointerId);return}const found=hit(p);selected=found?.id||null;if(found){snap();drag={mode:'move',start:p,x:found.x,y:found.y};canvas.setPointerCapture(e.pointerId)}draw();props()});canvas.addEventListener('pointermove',e=>{if(!drag)return;const it=get();if(!it)return;const p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(drag.mode==='move'){it.x=Math.round(drag.x+dx);it.y=Math.round(drag.y+dy)}else{it.w=Math.max(16,Math.round(drag.w+dx));it.h=Math.max(16,Math.round(drag.h+dy))}draw();const fields={px:it.x,py:it.y,pw:it.w,ph:it.h};for(const [id,v]of Object.entries(fields))if($(id))$(id).value=v});function end(){drag=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('dblclick',()=>{const it=get();if(it&&(it.type==='text'||it.type==='price'))$('ptext')?.focus()});$('addtext').onclick=()=>add('text');$('addprice').onclick=()=>add('price');$('addrect').onclick=()=>add('rect');$('addcircle').onclick=()=>add('circle');$('addimage').onclick=()=>$('imagefile').click();$('imagefile').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>8*1024*1024){alert('画像は8MB以下にしてください');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{snap();const id=uid++,w=Math.min(340,im.width),h=w*im.height/im.width;items.push({id,type:'image',x:95,y:150,w,h,rotation:0,src:reader.result});images.set(id,im);selected=id;draw();props()};im.src=reader.result};reader.readAsDataURL(file);e.target.value=''};$('background').onchange=e=>{snap();bg=e.target.value;draw()};$('paper').onchange=e=>{snap();size=e.target.value==='square'?{w:700,h:700}:e.target.value==='landscape'?{w:842,h:595}:{w:595,h:842};setSize()};$('undo').onclick=undo;$('redo').onclick=redo;$('clear').onclick=()=>{if(confirm('白紙に戻しますか？ 現在のデザインは消えます。')){snap();items=[];selected=null;draw();props()}};$('export').onclick=()=>{selected=null;render(false);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='tenpo-design.png';a.click();draw()};$('save').onclick=()=>{try{localStorage.setItem('tenpo-studio-v2',JSON.stringify({items,bg,size}));alert('このブラウザに下書きを保存しました')}catch(e){alert('保存できませんでした。画像が大きい可能性があります。')}};$('load').onclick=()=>{const raw=localStorage.getItem('tenpo-studio-v2');if(!raw){alert('保存された下書きがありません');return}if(!confirm('現在のデザインを下書きで置き換えますか？'))return;snap();const d=JSON.parse(raw);setDoc(d);uid=Math.max(1,...items.map(x=>x.id+1));for(const it of items)if(it.type==='image')loadImage(it)};window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.key==='Delete'||e.key==='Backspace')&&get()){snap();items=items.filter(x=>x.id!==selected);selected=null;draw();props()}});window.addEventListener('resize',setSize);setSize();updateHistory()})();
</script></body></html>
